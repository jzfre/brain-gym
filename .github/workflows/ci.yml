name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: brain
          POSTGRES_PASSWORD: brain
          POSTGRES_DB: brain_gym_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brain -d brain_gym_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://brain:brain@localhost:5432/brain_gym_test?schema=public
      TEST_DATABASE_URL: postgresql://brain:brain@localhost:5432/brain_gym_test?schema=public
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm check
      - run: pnpm exec prisma migrate deploy
      - run: pnpm db:seed
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm test:smoke
      - run: pnpm test:restart
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
